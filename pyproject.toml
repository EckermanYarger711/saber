[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saber"
version = "1.0.0"
description = "Damage-budgeted monitoring of liver-cancer organoids: planner, microenvironment estimator and conditioned response head"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saber platform group" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.6", "black>=24.0", "isort>=5.13"]

[project.scripts]
saber-cohort = "saber.cli.build_cohort:main"
saber-monitor = "saber.cli.monitor:main"
saber-belief = "saber.cli.estimate:main"
saber-response = "saber.cli.transfer:main"
saber-twin = "saber.cli.twin:main"
saber-verify = "saber.cli.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "RET", "C4", "PIE", "TID"]
ignore = ["E501", "B905"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = false
known_first_party = ["saber"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["build", "dist"]
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
