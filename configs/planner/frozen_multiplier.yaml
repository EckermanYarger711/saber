# Table 1 baseline: the Lagrangian objective with a frozen multiplier.
planner:
  variant: lagrangian_policy
  discount: 0.95
  wells_per_cycle: 2
  horizon: 48
  dual_step: 0.05
  lambda_init: 0.0
  saturation_threshold: 1.0e-5
  prune_top_k: 96
  control_window_s: 3.0
  budget_scale: 1.0
  belief_value: false
  uncertainty_propagation: true
  twin_based_training: true
  currency: rho
